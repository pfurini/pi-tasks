name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  # The build job above runs against the Pi pinned in devDependencies, which proves only the
  # top of the supported range.
  #
  # This job covers the other end: the earliest Pi the peerDependencies claim. install-pi.sh
  # reads that floor from package.json, so it can never test a version the range does not name.
  # It is NOT continue-on-error: a green run here is the only evidence behind that range, and
  # if the floor genuinely can't be supported any more, the peer range is what should change.
  compat-floor-pi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install floor Pi
        run: bash .github/scripts/install-pi.sh floor
      - name: Typecheck against floor Pi
        run: npm run typecheck
      - name: Test suite against floor Pi
        run: npx vitest run --reporter=dot

  # Forward canary: reinstall whatever Pi is `latest` over the pin, so a release newer than
  # the baseline surfaces here before it reaches users. It runs the full typecheck + suite,
  # not a hand-picked file list, so new drift can't hide in a test nobody remembered to add
  # here. Both steps pass at the pinned baseline, so a failure is fresh breakage.
  compat-latest-pi:
    runs-on: ubuntu-latest
    continue-on-error: true # current Pi is not a hard support guarantee; surface breakage without blocking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install current Pi
        run: bash .github/scripts/install-pi.sh latest
      - name: Typecheck against current Pi
        run: npm run typecheck
      - name: Test suite against current Pi
        run: npx vitest run --reporter=dot
